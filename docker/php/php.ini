memory_limit=512M
upload_max_filesize=20M
post_max_size=20M
date.timezone=UTC
opcache.enable=1
opcache.memory_consumption=256
opcache.validate_timestamps=1

; Cobertura desactivada per defecte: instrumentar cada `make test` no aporta res
; i alenteix. `make coverage` l'activa amb -d pcov.enabled=1.
pcov.enabled=0
pcov.directory=/var/www/html/src
