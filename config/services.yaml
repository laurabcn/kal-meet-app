# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Aquest fitxer no defineix serveis: només diu quins es carreguen i EN QUIN
# ORDRE. El manté MicroKernelTrait, que busca `config/services.yaml` per nom;
# `config/services/` no s'importa sol, a diferència de `config/packages/`.
#
# L'ordre no és estètic: `app.yaml` registra tot `src/` amb un glob i el que ve
# després REDEFINEIX serveis que aquell glob ja havia registrat (per posar-los
# arguments que l'autowiring no pot deduir). Al revés, el glob se'ls menjaria.
#
# Un context nou normalment NO afegeix res aquí: els controllers es registren
# sols amb `#[AsController]` i la resta la resol l'autowiring. Només cal un
# fitxer propi si algun servei necessita config explícita — escalars, `%env()%`,
# tags a mà. Ni `App\Kal\` ni `App\User\` en tenen.
imports:
    - { resource: services/app.yaml }
    - { resource: services/security.yaml }
